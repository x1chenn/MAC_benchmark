<figure class="fig" id="fig-modes">

  <defs>
    <marker id="ah-md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>

  <rect class="b k-agent k-focus" x="810" y="46" width="130" height="84" rx="4"/>
